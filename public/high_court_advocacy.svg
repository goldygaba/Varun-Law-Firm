<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="hcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142142"/>
      <stop offset="60%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="hcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd7"/>
      <stop offset="50%" stop-color="#c5a880"/>
      <stop offset="100%" stop-color="#8a693c"/>
    </linearGradient>
    <linearGradient id="woodPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1b14"/>
      <stop offset="100%" stop-color="#150d0a"/>
    </linearGradient>
  </defs>

  <!-- Background Courtroom Architecture -->
  <rect width="1200" height="675" fill="url(#hcBg)"/>

  <!-- High Court Grand Arch & Wood Paneling -->
  <g opacity="0.35">
    <!-- Neoclassical Columns -->
    <rect x="80" y="40" width="60" height="500" fill="#18274d"/>
    <rect x="1060" y="40" width="60" height="500" fill="#18274d"/>
    <!-- Capital and Base -->
    <rect x="60" y="30" width="100" height="20" fill="url(#hcGold)"/>
    <rect x="1040" y="30" width="100" height="20" fill="url(#hcGold)"/>
    <!-- Archway -->
    <path d="M 140 220 Q 600 40 1060 220" fill="none" stroke="url(#hcGold)" stroke-width="4"/>
  </g>

  <!-- Judicial Bench & Emblem -->
  <rect x="250" y="160" width="700" height="120" rx="8" fill="url(#woodPanel)" stroke="url(#hcGold)" stroke-width="2"/>
  <rect x="280" y="180" width="640" height="80" rx="4" fill="#1b120d" stroke="url(#hcGold)" stroke-opacity="0.3"/>
  
  <!-- Ashoka Chakra / High Court Emblem -->
  <circle cx="600" cy="220" r="28" fill="#081024" stroke="url(#hcGold)" stroke-width="2"/>
  <path d="M 600 200 L 600 240 M 580 220 L 620 220 M 586 206 L 614 234 M 586 234 L 614 206" stroke="url(#hcGold)" stroke-width="1.5"/>

  <!-- Advocate Dais / Podium (Foreground) -->
  <path d="M 450 420 L 750 420 L 820 675 L 380 675 Z" fill="#1a110c" stroke="url(#hcGold)" stroke-width="2"/>
  
  <!-- Advocate Silhouette (Varun Aggarwal with Black Coat & Neck Bands) -->
  <!-- Black Advocate Gown & Coat -->
  <path d="M 460 675 C 480 480 540 400 600 400 C 660 400 720 480 740 675 Z" fill="#0a0a0c" stroke="#333" stroke-width="1"/>
  
  <!-- Traditional White Advocate Bands (Indian High Court / Supreme Court) -->
  <polygon points="600,430 588,510 600,505 612,510" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <rect x="590" y="420" width="20" height="15" fill="#ffffff"/>
  <line x1="600" y1="435" x2="600" y2="505" stroke="#94a3b8" stroke-width="1"/>

  <!-- Head with Glasses & Demeanor -->
  <ellipse cx="600" cy="330" rx="60" ry="75" fill="#f0d5b6"/>
  <path d="M 540 320 C 540 250 560 230 600 230 C 640 230 660 250 660 320 C 645 300 625 295 600 295 C 575 295 555 300 540 320 Z" fill="#181818"/>
  
  <!-- Rimless Rectangular Glasses -->
  <rect x="555" y="315" width="38" height="22" rx="3" fill="rgba(255,255,255,0.3)" stroke="url(#hcGold)" stroke-width="2"/>
  <rect x="607" y="315" width="38" height="22" rx="3" fill="rgba(255,255,255,0.3)" stroke="url(#hcGold)" stroke-width="2"/>
  <line x1="593" y1="326" x2="607" y2="326" stroke="url(#hcGold)" stroke-width="2"/>
  <!-- Trimmed Beard -->
  <path d="M 558 355 C 570 405 630 405 642 355 C 630 365 615 370 600 370 C 585 370 570 365 558 355 Z" fill="#221e1a" opacity="0.9"/>

  <!-- Case Brief Docket in Hands / On Podium -->
  <rect x="510" y="440" width="180" height="35" rx="4" fill="#eed9b7" stroke="#8a693c" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2a1b14" letter-spacing="1">HIGH COURT WRIT PETITION</text>

  <!-- Left Bench Reference & Legal Volume Stack -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="160" height="40" rx="3" fill="#691212" stroke="url(#hcGold)" stroke-width="1"/>
    <text x="80" y="24" text-anchor="middle" font-family="serif" font-size="12" fill="#fff">All India Reporter (AIR)</text>
    <rect x="10" y="-35" width="140" height="35" rx="3" fill="#143b24" stroke="url(#hcGold)" stroke-width="1"/>
    <text x="80" y="-12" text-anchor="middle" font-family="serif" font-size="12" fill="#fff">Supreme Court Cases</text>
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(600, 630)">
    <rect x="-280" y="-22" width="560" height="44" rx="8" fill="#060c1d" stroke="url(#hcGold)" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="1">PUNJAB &amp; HARYANA HIGH COURT ADVOCACY</text>
    <text x="0" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#c5a880" letter-spacing="1.5">DIVISION BENCH · APPEALS · WRIT JURISDICTION</text>
  </g>
</svg>
